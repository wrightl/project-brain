name: Deploy (production)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AZD_USE_AZURE_CLI_CREDENTIALS: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Azure login (OIDC)
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install azd
        uses: Azure/setup-azd@v2.2.1

      - name: Log in with Azure (azd OIDC)
        run: |
          azd auth login \
            --client-id "${{ secrets.AZURE_CLIENT_ID }}" \
            --federated-credential-provider "github" \
            --tenant-id "${{ secrets.AZURE_TENANT_ID }}"

      - name: Configure azd environment
        shell: bash
        env:
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          DEPLOYMENT_ENVIRONMENT: ${{ vars.DEPLOYMENT_ENVIRONMENT }}
          MIN_REPLICAS: ${{ vars.MIN_REPLICAS }}
          CUSTOMDOMAIN_API: ${{ vars.CUSTOMDOMAIN_API }}
          CUSTOMDOMAIN_APP: ${{ vars.CUSTOMDOMAIN_APP }}
          CERTIFICATE_NAME_API: ${{ vars.CERTIFICATE_NAME_API }}
          CERTIFICATE_NAME_APP: ${{ vars.CERTIFICATE_NAME_APP }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_MANAGEMENT_API_CLIENT_ID: ${{ secrets.AUTH0_MANAGEMENT_API_CLIENT_ID }}
          AUTH0_MANAGEMENT_API_CLIENT_SECRET: ${{ secrets.AUTH0_MANAGEMENT_API_CLIENT_SECRET }}
          AUTH0_WEBHOOK_TOKEN: ${{ secrets.AUTH0_WEBHOOK_TOKEN }}
          LAUNCHDARKLY_SDK_KEY: ${{ secrets.LAUNCHDARKLY_SDK_KEY }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          ADMIN_USER_PASSWORD: ${{ secrets.ADMIN_USER_PASSWORD }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          CACHE_PASSWORD: ${{ secrets.CACHE_PASSWORD }}
          GOOGLE_MAPS_GEOCODING_API_KEY: ${{ secrets.GOOGLE_MAPS_GEOCODING_API_KEY }}
        run: |
          set -euo pipefail

          azd env new "$AZURE_ENV_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION" \
            --no-prompt \
            || azd env select "$AZURE_ENV_NAME" --no-prompt

          # Core azd settings (ensures provision/deploy are non-interactive)
          azd env set AZURE_LOCATION "$AZURE_LOCATION" -e "$AZURE_ENV_NAME" --no-prompt
          azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID" -e "$AZURE_ENV_NAME" --no-prompt

          # AppHost parameters
          azd env set deploymentEnvironment "$DEPLOYMENT_ENVIRONMENT" -e "$AZURE_ENV_NAME" --no-prompt
          azd env set environmentName "$DEPLOYMENT_ENVIRONMENT" -e "$AZURE_ENV_NAME" --no-prompt
          azd env set minReplicas "$MIN_REPLICAS" -e "$AZURE_ENV_NAME" --no-prompt

          # Custom domain/certificate inputs (optional)
          azd env set CUSTOMDOMAIN_API "${CUSTOMDOMAIN_API:-}" -e "$AZURE_ENV_NAME" --no-prompt
          azd env set CUSTOMDOMAIN_APP "${CUSTOMDOMAIN_APP:-}" -e "$AZURE_ENV_NAME" --no-prompt
          azd env set CERTIFICATE_NAME_API "${CERTIFICATE_NAME_API:-}" -e "$AZURE_ENV_NAME" --no-prompt
          azd env set CERTIFICATE_NAME_APP "${CERTIFICATE_NAME_APP:-}" -e "$AZURE_ENV_NAME" --no-prompt

          # Secrets (required by infra/app configuration)
          azd env set auth0_domain "$AUTH0_DOMAIN" -e "$AZURE_ENV_NAME" --no-prompt
          azd env set auth0_clientid "$AUTH0_CLIENT_ID" -e "$AZURE_ENV_NAME" --no-prompt
          azd env set auth0_managementapiclientid "$AUTH0_MANAGEMENT_API_CLIENT_ID" -e "$AZURE_ENV_NAME" --no-prompt
          azd env set auth0_managementapiclientsecret "$AUTH0_MANAGEMENT_API_CLIENT_SECRET" -e "$AZURE_ENV_NAME" --no-prompt
          azd env set auth0_webhook_token "$AUTH0_WEBHOOK_TOKEN" -e "$AZURE_ENV_NAME" --no-prompt
          azd env set launchdarkly_sdk_key "$LAUNCHDARKLY_SDK_KEY" -e "$AZURE_ENV_NAME" --no-prompt
          azd env set mailgun_api_key "$MAILGUN_API_KEY" -e "$AZURE_ENV_NAME" --no-prompt
          azd env set mailgun_domain "$MAILGUN_DOMAIN" -e "$AZURE_ENV_NAME" --no-prompt
          azd env set firebase_credentials_json "$FIREBASE_CREDENTIALS_JSON" -e "$AZURE_ENV_NAME" --no-prompt
          azd env set admin_user_password "$ADMIN_USER_PASSWORD" -e "$AZURE_ENV_NAME" --no-prompt
          azd env set cache_password "$CACHE_PASSWORD" -e "$AZURE_ENV_NAME" --no-prompt
          azd env set projectbrain_password "$SQL_PASSWORD" -e "$AZURE_ENV_NAME" --no-prompt
          azd env set google_maps_geocoding_api_key "$GOOGLE_MAPS_GEOCODING_API_KEY" -e "$AZURE_ENV_NAME" --no-prompt

      - name: Provision
        run: azd provision -e "${{ vars.AZURE_ENV_NAME }}" --no-prompt

      - name: Deploy
        run: azd deploy --all -e "${{ vars.AZURE_ENV_NAME }}" --no-prompt

