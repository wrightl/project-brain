name: Sleep staging

# Scales staging API + frontend to minReplicas=0 so Azure SQL can auto-pause.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sleep:
    runs-on: ubuntu-latest
    environment: staging
    env:
      RESOURCE_GROUP: rg-projectbrain-staging
      CONTAINER_APPS: api frontend
      TARGET: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Log in with Azure (Federated Credentials)
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Scale staging apps to minReplicas=0
        run: .github/scripts/set-min-replicas.sh
