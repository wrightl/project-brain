name: azure deploy

on:
  workflow_call:
    inputs:
      deploy_environment:
        description: "Target environment (e.g. staging or production)"
        required: true
        type: string

# Set up permissions for deploying with secretless Azure federated credentials
# https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure?tabs=azure-portal%2Clinux#set-up-azure-login-with-openid-connect-authentication
permissions:
  id-token: write
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy_environment }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CERTIFICATE_NAME_API: ${{ vars.CERTIFICATE_NAME_API }}
      AZURE_CUSTOM_DOMAIN_API: ${{ vars.CUSTOMDOMAIN_API }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_MIN_REPLICAS: ${{ vars.MIN_REPLICAS }}
      AZURE_CERTIFICATE_NAME_APP: ${{ vars.CERTIFICATE_NAME_APP }}
      AZURE_CUSTOM_DOMAIN_APP: ${{ vars.CUSTOMDOMAIN_APP }}
      AZURE_DEPLOYMENT_ENVIRONMENT: ${{ vars.DEPLOYMENT_ENVIRONMENT }}
    steps:
      - name: Write secret to file (temporary debug)
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          echo "$FIREBASE_CREDENTIALS_JSON" > firebase-secret-debug.json
        shell: bash

      - name: Upload secret file (REMOVE AFTER DEBUG)
        uses: actions/upload-artifact@v4
        with:
          name: firebase-secret-debug
          path: firebase-secret-debug.json
          retention-days: 1

