name: Test

on:
  workflow_call:

jobs:
  dotnet-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Test API
        run: dotnet test ProjectBrain.Api.Tests/ProjectBrain.Api.Tests.csproj --configuration Release --verbosity normal

      - name: Test Database
        run: dotnet test ProjectBrain.Database.Tests/ProjectBrain.Database.Tests.csproj --configuration Release --verbosity normal

      - name: Test API Integration
        run: dotnet test ProjectBrain.Api.IntegrationTests/ProjectBrain.Api.IntegrationTests.csproj --configuration Release --verbosity normal

      - name: Test Database Integration
        run: dotnet test ProjectBrain.Database.IntegrationTests/ProjectBrain.Database.IntegrationTests.csproj --configuration Release --verbosity normal

      - name: Test Migration Service
        run: dotnet test ProjectBrain.MigrationService.Tests/ProjectBrain.MigrationService.Tests.csproj --configuration Release --verbosity normal

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projectbrain.frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projectbrain.frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
